name: mlops-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Updated from @v2 to @v4 for modern performance stability
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. FIXED: Typo corrected to 'actions/' and upgraded to @v5
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    # 3. FIXED: Added the '|' character for executing multi-line bash scripts
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest streamlit

    - name: Run tests
      run: pytest _test.py