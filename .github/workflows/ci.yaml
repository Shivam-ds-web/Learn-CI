name: mlops-ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set Up Python
      uses: action/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install Dependencies
      run:
        python -m pip install --upgrade pip
        pip install pytest streamlit
    - name: Run tests
      run:
        pytest _test.py